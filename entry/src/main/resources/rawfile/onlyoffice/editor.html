<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #status { font-size: 18px; }
  </style>
</head>
<body>
  <h3>POC-1 OnlyOffice Bridge</h3>
  <div id="status">loading...</div>
  <script>
    function onReady() {
      var el = document.getElementById('status');
      if (typeof window.Asc === 'object' && typeof window.Asc.getDocument === 'function') {
        var doc = window.Asc.getDocument();
        el.textContent = 'Asc bridge OK. document.json head = ' + doc.substring(0, 80);
      } else {
        el.textContent = 'bridge MISSING (window.Asc not available)';
      }
    }
    if (document.readyState === 'complete') {
      onReady();
    } else {
      window.addEventListener('load', onReady);
    }
  </script>
</body>
</html>
